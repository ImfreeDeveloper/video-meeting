services:
  postgres:
    image: postgres:17-alpine
    container_name: claudelar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claudelar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claudelar}
      POSTGRES_DB: ${POSTGRES_DB:-claudelar}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-claudelar}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
